# gitmux: git status for the tmux status bar (used by the catppuccin gitmux module)
# Colours are Catppuccin Macchiato hex values, to match the tmux theme.
tmux:
    symbols:
        branch: ""
        hashprefix: ":"
        ahead: ↑
        behind: ↓
        staged: "● "
        conflict: "✖ "
        modified: "✚ "
        untracked: "… "
        stashed: "⚑ "
        insertions: Σ
        deletions: Δ
        clean: ✔
    styles:
        # gitmux ends its output by resetting the background, which leaves a gap
        # before the next module. This style is printed last and puts it back.
        clear: "#[fg=#cad3f5,bg=#363a4f,nobold]"
        state: "#[fg=#ed8796,bold]"
        branch: "#[fg=#cad3f5,bold]"
        remote: "#[fg=#8bd5ca]"
        divergence: "#[fg=#cad3f5]"
        staged: "#[fg=#a6da95,bold]"
        conflict: "#[fg=#ed8796,bold]"
        modified: "#[fg=#eed49f,bold]"
        untracked: "#[fg=#c6a0f6,bold]"
        stashed: "#[fg=#8aadf4,bold]"
        insertions: "#[fg=#a6da95]"
        deletions: "#[fg=#ed8796]"
        clean: "#[fg=#f4dbd6,bold]"
    # Branch, how far ahead/behind, then working-tree counts. No remote name or
    # line stats, to keep it short.
    layout: [branch, " ", divergence, " ", flags]
    options:
        branch_max_len: 16
        branch_trim: right
        ellipsis: …
        hide_clean: false
