set -g default-terminal "tmux-256color"
    set-option -sa terminal-overrides ",xterm*:Tc,alacritty:Tc"
set -g mouse on
set -s escape-time 0

# set prefix to C-a so it doesn't conflict with remote sessions
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload config file with <prefix> + r
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Theme
set -g @plugin 'Nybkox/tmux-ukiyo'
set -g @ukiyo-theme 'kanagawa/dragon'

# Packages
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # Persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # Automatically save sessions every 15 minutes
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-yank'

# Preserve background
set -g @ukiyo-ignore-window-colors true
# Force tmux to use the terminal's default background color
set-option -g status-style bg=default

run '~/.tmux/plugins/tpm/tpm'

# OVERRIDES - Must go after the plugin loader!
set-option -g status-style bg=default
set-option -g status-left-style bg=default
set-option -g status-right-style bg=default
set-window-option -g window-status-style bg=default
set-window-option -g window-status-current-style bg=default
set-window-option -g window-style bg=default
set-window-option -g window-active-style bg=default
