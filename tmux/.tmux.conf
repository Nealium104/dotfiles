set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -s escape-time 0

# number windows and panes from 1, and close the gaps when one is closed
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# vi keys in copy mode
setw -g mode-keys vi

# new panes start in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# set prefix to C-a so it doesn't conflict with remote sessions
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload config file with <prefix> + r
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Move through panes with Prefix, followed by hjkl
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes with Prefix, followed by holding Ctrl + hjkl
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Theme
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_status_background 'none'

# Tab number colour: green while the prefix is active. Otherwise grey, except
# the active tab, which is coloured by position (1 red, 2 orange, 3 yellow,
# 4 green, 5 blue, others purple).
set -g @catppuccin_window_number_color '#{?client_prefix,#{@thm_green},#{@thm_overlay_2}}'
set -g @catppuccin_window_current_number_color '#{?client_prefix,#{@thm_green},#{?#{==:#{window_index},1},#{@thm_red},#{?#{==:#{window_index},2},#{@thm_peach},#{?#{==:#{window_index},3},#{@thm_yellow},#{?#{==:#{window_index},4},#{@thm_green},#{?#{==:#{window_index},5},#{@thm_blue},#{@thm_mauve}}}}}}}'

# Rounded tabs by hand: the theme's 'rounded' style leaves a box behind each
# cap when the status background is transparent.
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_left_separator '#[fg=#{@catppuccin_window_number_color},bg=default]#[fg=#{@thm_crust},bg=#{@catppuccin_window_number_color}]'
set -g @catppuccin_window_current_left_separator '#[fg=#{@catppuccin_window_current_number_color},bg=default]#[fg=#{@thm_crust},bg=#{@catppuccin_window_current_number_color}]'
set -g @catppuccin_window_middle_separator ' '
set -g @catppuccin_window_right_separator '#[fg=#{@thm_surface_0},bg=default]#[none]'
set -g @catppuccin_window_current_right_separator '#[fg=#{@thm_surface_1},bg=default]#[none]'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Tab flags: zoom, activity and bell only
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_window_flags_icon_current ''
set -g @catppuccin_window_flags_icon_last ''
# No activity icon on the first tab (btop). l: defers the test to draw time.
set -g @catppuccin_window_flags_icon_activity '#{l:#{?window_start_flag,, 󱅫}}'
setw -g monitor-activity on
bind a setw monitor-activity \; display-message 'Activity monitoring: #{?monitor-activity,on,off}'

# Module colours: green while the prefix is active, otherwise a rainbow from
# left to right across the right-hand modules
set -g @catppuccin_host_color          '#{?client_prefix,#{E:@thm_green},#{E:@thm_blue}}'
set -g @catppuccin_pomodoro_plus_color '#{?client_prefix,#{E:@thm_green},#{E:@thm_red}}'
set -g @catppuccin_application_color   '#{?client_prefix,#{E:@thm_green},#{E:@thm_peach}}'
set -g @catppuccin_gitmux_color        '#{?client_prefix,#{E:@thm_green},#{E:@thm_yellow}}'
set -g @catppuccin_weather_color       '#{?client_prefix,#{E:@thm_green},#{E:@thm_green}}'
set -g @catppuccin_battery_color       '#{?client_prefix,#{E:@thm_green},#{E:@thm_blue}}'

# Module text. Each carries its own padding and the theme's trailing separator
# is turned off, so a module with nothing to show (pomodoro when idle, git
# outside a repo) collapses to just its coloured icon.
# Battery, weather and pomodoro call the plugin scripts directly; the plugins'
# own placeholders are filled in once at load, which would freeze the prefix colour.
set -g @catppuccin_status_right_separator ''
set -g @catppuccin_host_text ' #H '
set -g @catppuccin_application_text ' #{pane_current_command} '
set -g @catppuccin_weather_text ' #(~/.tmux/plugins/tmux-weather/scripts/weather.sh) '
# The charge-level icon. The plugin's combined icon shows a question mark for
# any status it doesn't know, including WSL's "Not charging".
set -g @catppuccin_battery_icon '#(~/.tmux/plugins/tmux-battery/scripts/battery_icon_charge.sh) '
# WSL reports a bare number, hence the % (doubled: tmux runs the bar through strftime)
set -g @catppuccin_battery_text ' #(~/.tmux/plugins/tmux-battery/scripts/battery_percentage.sh)%% '
# Pomodoro and git draw their own grey text block, and only when they have
# text. Otherwise their background stays their own colour, so the next
# module's rounded end sits directly on it.
set -g @catppuccin_status_pomodoro_plus_text_bg '#{E:@catppuccin_pomodoro_plus_color}'
set -g @catppuccin_status_gitmux_text_bg '#{E:@catppuccin_gitmux_color}'
set -g @catppuccin_pomodoro_plus_text '#(out=$(~/.tmux/plugins/tmux-pomodoro-plus/scripts/pomodoro.sh); [ -n "$out" ] && echo "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] $out ")'

# Packages
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'xamut/tmux-weather'
set -g @tmux-weather-units 'u'
# Text, not emoji: emoji are double-width and break the pill
set -g @tmux-weather-format '%C+%t'
set -g @plugin 'olimorris/tmux-pomodoro-plus'
# The default start key, p, is tmux's previous-window
set -g @pomodoro_toggle 't'
set -g @pomodoro_cancel 'T'
set -g @pomodoro_notifications 'on'
# Nerd Font icons in place of the plugin's emoji, which are double-width.
# None can be empty: the plugin falls back to its emoji for an empty value.
set -g @pomodoro_on ' '
set -g @pomodoro_pause ' '
set -g @pomodoro_complete ' '
set -g @pomodoro_prompt_break ' break?'
set -g @pomodoro_prompt_pomodoro ' start?'
set -g @plugin 'tmux-plugins/tmux-resurrect' # Persist tmux sessions after computer restart
set -g @resurrect-strategy-nvim 'session'
# continuum must be last: it hooks into status-right
set -g @plugin 'tmux-plugins/tmux-continuum' # Automatically save sessions every 15 minutes
set -g @continuum-restore 'on'

# Status line. The theme only rounds a module's left end, so the host's right
# cap is added by hand.
set -g status-left-length 60
set -g status-left " #{E:@catppuccin_status_host}#[fg=#{@thm_surface_0},bg=default]#[default] "
set -g status-right-length 200
set -g status-right "#{E:@catppuccin_status_pomodoro_plus}#{E:@catppuccin_status_application}#{E:@catppuccin_status_gitmux}#{E:@catppuccin_status_weather}#{E:@catppuccin_status_battery}"

run '~/.tmux/plugins/tpm/tpm'

# Everything below must come after the plugins load.

# Same collapsing text for git. The theme sets this one unconditionally, so it
# has to be overridden after it loads.
set -g @catppuccin_gitmux_text '#(out=$(gitmux -cfg $HOME/.gitmux.conf "#{pane_current_path}"); [ -n "$out" ] && echo "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] $out ")'

# The theme recolours the whole tab on bell or activity, which shows as a box
# behind the rounded caps
set -g window-status-bell-style default
set -g window-status-activity-style default

# One blank line above and below the bar: three status lines, bar in the middle
set -g status 3
set -gu status-format
set -gF "status-format[1]" "#{status-format[0]}"
set -g "status-format[0]" ""
set -g "status-format[2]" ""
