- name: Provision Development Environment
  hosts: localhost
  connection: local
  # package names in group_vars

  tasks:
    - name: Update apt chache and install core packages
      become: true
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: yes

    - name: Create a temporary directory for packages
      ansible.builtin.tempfile:
        state: directory
        suffix: _ansible
      register: tmp
      check_mode: false

    - name: Main tasks
      block:
      - name: Check for existing neovim
        ansible.builtin.shell: "/opt/nvim/bin/nvim --version | head -n 1"
        register: check_nvim
        ignore_errors: true # don't fail the playbook if neovim doesn't exist yet
        changed_when: false

      - name: Install or update neovim
        block:
          - name: Download neovim release
            become: true
            ansible.builtin.get_url:
              url: "https://github.com/neovim/neovim/releases/download/{{ neovim_version }}/nvim-linux-x86_64.tar.gz"
              dest: "{{ tmp.path }}/nvim.tar.gz"
            check_mode: false

          - name: Unarchive neovim
            ansible.builtin.unarchive:
              src: "{{ tmp.path }}/nvim.tar.gz"
              dest: "{{ tmp.path }}"
              remote_src: yes # file exists on this machine, through localhost
            check_mode: false
        
          - name: Install neovim to /opt
            become: true
            ansible.builtin.copy:
              src: "{{ tmp.path }}/nvim-linux-x86_64/"
              dest: "/opt/nvim"
              mode: preserve
              remote_src: yes

          - name: Symlink nvim binary to path
            become: true
            ansible.builtin.file:
              src: "/opt/nvim/bin/nvim"
              dest: "/usr/local/bin/nvim"
              state: link
              force: yes

        when: check_nvim.failed or neovim_version not in check_nvim.stdout

      - name: Install Node.js
        become: true
        block:
          - name: Install dependencies for NodeSource
            ansible.builtin.apt:
              name:
                - ca-certificates
                - curl
                - gnupg
              state: present

          - name: Create keyrings directory
            ansible.builtin.file:
              path: /etc/apt/keyrings
              state: directory
              mode: '0755'

          - name: Download NodeSource GPG key
            ansible.builtin.get_url:
              url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
              dest: "/etc/apt/keyrings/nodesource.asc"
              mode: '0644'
              force: true # Ensure we always get the valid key

          - name: Add NodeSource repository
            ansible.builtin.apt_repository:
              repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major_version }} nodistro main"
              state: present
              filename: nodesource

          - name: Install Node.js
            ansible.builtin.apt:
              name: nodejs
              state: present
              update_cache: yes

      - name: Install Docker Engine
        become: true
        block:
          - name: Add Docker GPG key
            ansible.builtin.get_url:
              url: https://download.docker.com/linux/ubuntu/gpg
              dest: /etc/apt/keyrings/docker.asc
              mode: '0644'
              force: true

          - name: Add Docker repository
            ansible.builtin.apt_repository:
              repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
              state: present
              filename: docker

          - name: Install Docker packages
            ansible.builtin.apt:
              name:
                - docker-ce
                - docker-ce-cli
                - containerd.io
                - docker-buildx-plugin
                - docker-compose-plugin
              state: present
              update_cache: yes

          - name: Add current user to docker group
            ansible.builtin.user:
              name: "{{ lookup('env', 'USER') }}"
              groups: docker
              append: yes

          - name: Ensure Docker service is started
            ansible.builtin.service:
              name: docker
              state: started
              enabled: yes

      - name: Remove existing configs that would conflict with stow
        ansible.builtin.file:
          path: "{{ item }}"
          state: absent
        loop:
          - "{{ ansible_env.HOME }}/.bashrc"
          - "{{ ansible_env.HOME }}/.config/nvim"
          - "{{ ansible_env.HOME }}/.config/posh"
          - "{{ ansible_env.HOME }}/.config/wezterm"
          - "{{ ansible_env.HOME }}/.config/alacritty"
          - "{{ ansible_env.HOME }}/.tmux.conf"

      - name: Stow Local Configs
        ansible.builtin.shell:
          cmd: "stow -v -t {{ lookup('env', 'HOME') }} {{ item }}"
          chdir: "{{ dotfiles_dir }}"
        loop: "{{ stow_packages }}"
        register: stow_result
        changed_when: "'LINK' in stow_result.stderr"
        
      always:
        - name: cleanup temp files
          ansible.builtin.file:
            path: "{{ tmp.path }}"
            state: absent
          check_mode: false
